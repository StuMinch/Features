name: iOS Distribution Workflow on Sauce Labs Real Devices

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build and Distribute on Sauce Labs Real Devices
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Increment Build Number
        run: |
          # Ensure we are in the directory with the .xcodeproj
          # Set the build number (Bundle Version) to the GitHub Run Number
          xcrun agvtool new-version -all ${{ github.run_number }}
      - name: Build for a Generic iOS Device to test on Sauce
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ "$scheme" = "default" ]; then scheme=$(cat default); fi
    
          if [ "$(ls -A | grep -i \.xcworkspace\$)" ]; then 
            filetype_parameter="workspace"
            file_to_build="$(ls -A | grep -i \.xcworkspace\$ | head -1)"
          else 
            filetype_parameter="project"
            file_to_build="$(ls -A | grep -i \.xcodeproj\$ | head -1)"
          fi

          xcodebuild build-for-testing \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Upload to Sauce Labs App Storage for testing
        env:
          scheme: ${{ 'default' }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_APP_DISTRIBUTION_KEY: ${{ secrets.SAUCE_APP_DISTRIBUTION_KEY }}
        run: |
          cd build/Build/Products/Debug-iphoneos/
          mkdir Payload
          cp -r Features.app Payload/
          zip -r Features-${{ github.run_number }}.ipa Payload
          
          echo "***** Uploading to Sauce Labs Storage *****"
          curl -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" --location \
            --request POST 'https://api.us-west-1.saucelabs.com/v1/storage/upload' \
            --form 'payload=@"Features-${{ github.run_number }}.ipa"' \
            --form 'name="Features-${{ github.run_number }}.ipa"'

      - name: Import signing certificate & profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERT_PATH=$RUNNER_TEMP/dist_cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Show available signing identities
        run: security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain

      - name: Archive for In-House distribution
        env:
          scheme: default
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          if [ "$scheme" = "default" ]; then scheme=$(cat default); fi

          if [ "$(ls -A | grep -i \.xcworkspace\$)" ]; then
            filetype_parameter="workspace"
            file_to_build="$(ls -A | grep -i \.xcworkspace\$ | head -1)"
          else
            filetype_parameter="project"
            file_to_build="$(ls -A | grep -i \.xcodeproj\$ | head -1)"
          fi

          sed -i '' "s/YOUR_EXACT_PROFILE_NAME/$PROFILE_NAME/" ci/Signing.xcconfig
          sed -i '' "s/FZ477BG7U9/$DEVELOPMENT_TEAM/" ci/Signing.xcconfig

          xcodebuild archive \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -xcconfig ci/Signing.xcconfig

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist
      
      - name: Upload to Sauce Labs Mobile App Distribution
        run:
          echo "***** Uploading to Sauce Labs Mobile App Distribution *****"
          curl https://upload.testfairy.com/api/upload \
            -F api_key=$SAUCE_APP_DISTRIBUTION_KEY \
            -F file=@Features.ipa \
            -F metadata.branch=master \
            -F metadata.locale=us-en \
            -F folder_name=Features \
            -F group=Features-Beta \
            -F notify=on

          echo "***** Notifying Beta Group *****"
          curl -u "stuart.minchington+sedemo@saucelabs.com:$SAUCE_APP_DISTRIBUTION_KEY" https://api.testfairy.com/api/1/testers/ \
            -F email="stuart.minchington+sedemo@saucelabs.com" \
            -F group=Features-Beta \
            -F notify=on
